[workspace]
name = "toksearch_d3d"
channels = ["ga-fdp", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
toksearch = ">=2.12.0"
ptdata = ">=2.6.0,<3"
matplotlib = "*"
imas_composer = ">=0.2.4,<0.3"
filelock = ">=3"
# Phase 1 catalog migration. `fdp` is needed for the recipe test step
# (which runs `fdp run testit.py`); `fdp-schema` is needed by fdp.catalog.
fdp = ">=0.2.4"
fdp-schema = ">=0.1.2"
socat = ">=1.8.1.1,<2"
seaborn = ">=0.13.2,<0.14"
pelicanplatform = ">=7.24.3,<8"
anthropic = "0.101.*"
socksio = ">=1.0.0,<2"
gradio = ">=4,<7"
plotly = ">=6.6.0,<7"
python-kaleido = ">=1.2.0,<2"
# toksearch's full run-deps surface from its conda recipe. Mirror
# them here so the editable install gets the same environment as a
# released conda install would.
mdsplus-xrdcl = ">=1,<2"
numpy = ">=1.20,<2"
pymssql = "*"
ray-core = "*"
pyspark = ">=4"
scipy = "*"
sh = "*"
xarray = "*"
bottleneck = "*"
openblas = "*"
joblib = ">=1.3"
jupyter = "*"
fsspec = "*"
zarr = "3.*"
openai = ">=1.50"
claude-agent-sdk = ">=0.2"
mcp = ">=1.23"

[pypi-dependencies]
toksearch_d3d = { path = ".", editable = true }
# Sibling editable installs (fdp, toksearch, fdp_schema) are no longer
# wired here because `../fdp`, `../toksearch`, `../fdp_schema` don't
# resolve on CI runners (only this repo is checked out). The released
# conda packages are pulled via `[dependencies]` below. Devs who need to
# iterate against local checkouts can `pixi run pip install -e ../<repo>
# --force-reinstall` after `pixi install`.

[feature.docs.dependencies]
python = "3.10.*"
mkdocs = "1.5.3.*"
mkdocs-autorefs = "<1.4"
mkdocs-material = "9.5.*"
mkdocstrings = "0.24.1.*"
mkdocstrings-python = "1.9.1.*"
mkdocs-jupyter = "0.24.6.*"
mike = "2.0.*"
griffe = "<1"

[feature.docs.tasks]
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"

[environments]
docs = { features = ["docs"], no-default-feature = true }
