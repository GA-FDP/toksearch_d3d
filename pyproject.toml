[build-system]
requires = ["setuptools>=61", "versioneer[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "toksearch_d3d"
dynamic = ["version"]
description = "TokSearch DIII-D: Signal retrieval classes for DIII-D fusion experiment data"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Runtime dependencies are declared in recipe/recipe.yaml; toksearch is
# distributed via the ga-fdp conda channel only (not PyPI).  Keeping
# dependencies = [] here so `pip install toksearch_d3d` and pixi's pypi
# resolver don't try to fetch `toksearch` from PyPI.
dependencies = []

[project.optional-dependencies]
imas = ["imas_composer", "awkward>=2.0"]

[project.scripts]
pcssetup-to-wa10 = "toksearch_d3d.tools.pcssetup_to_wa10:main"

[tool.setuptools]
packages = ["toksearch_d3d", "toksearch_d3d.llm", "toksearch_d3d.signal", "toksearch_d3d.tools"]
zip-safe = false

[tool.setuptools.package-data]
toksearch_d3d = ["skills/*/SKILL.md"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "toksearch_d3d/_version.py"
versionfile_build = "toksearch_d3d/_version.py"
tag_prefix = "release-"
parentdir_prefix = "toksearch_d3d-"

[project.entry-points."toksearch.llm.namespace"]
toksearch_d3d = "toksearch_d3d"

[project.entry-points."toksearch.llm.skills"]
toksearch_d3d = "toksearch_d3d.llm:skills_path"

[project.entry-points."toksearch.llm.presets"]
amsc = "toksearch_d3d.llm:AMSC_PRESET"

[project.entry-points."fdp.devices"]
d3d = "toksearch_d3d.fdp:D3D_DEVICE"
