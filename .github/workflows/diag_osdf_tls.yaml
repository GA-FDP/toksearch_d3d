name: diag OSDF TLS
on: pull_request
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12"]
    runs-on: macos-15
    env:
      BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
    steps:
      - uses: prefix-dev/setup-pixi@v0.8.1
        with: {pixi-version: latest, run-install: false}
      - name: repro
        run: |
          cat > /tmp/probe.py <<'PY'
          import ssl, os, sys, duckdb, toksearch, platform
          print("python", sys.version.split()[0], "duckdb", duckdb.__version__, "toksearch", toksearch.__version__)
          print("verify paths", ssl.get_default_verify_paths())
          print("SSL env", {k: v for k, v in os.environ.items() if "CERT" in k or "SSL" in k or "CA_" in k})
          import toksearch.sql._snapshot_db as m, inspect
          print("ca_cert_file in source:", "ca_cert_file" in inspect.getsource(m._open_duckdb), m.__file__)
          orig = m._open_duckdb
          def spy(duckdb_mod, token, base=None):
              con = orig(duckdb_mod, token, base)
              for name in ("ca_cert_file", "httpfs_client_implementation"):
                  try: print("  setting", name, "=", con.execute(f"SELECT current_setting('{name}')").fetchone())
                  except Exception as e: print("  setting", name, "ERR", str(e)[:120])
              print("  httpfs ext:", con.execute("SELECT extension_version, install_path FROM duckdb_extensions() WHERE extension_name='httpfs'").fetchall())
              return con
          m._open_duckdb = spy
          import pandas as pd
          from toksearch_d3d.sql import connect_d3drdb
          for i in range(3):
              try:
                  with connect_d3drdb() as c:
                      print("try", i, pd.read_sql("SELECT count(*) n FROM shots_type", c).n[0])
              except Exception as e:
                  print("try", i, "FAIL", str(e)[:250])
          PY
          pixi exec -c ga-fdp/label/staging -c ga-fdp -c conda-forge \
            -s "python ${{ matrix.py }}.*" -s "toksearch ==2.23.1" -s "toksearch_d3d ==0.17.0" -s "fdp >=0.12.1" \
            -- bash -c "pixi --version; fdp run python /tmp/probe.py"
