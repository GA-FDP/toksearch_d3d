name: diag macOS TLS

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: diag
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          run-install: false
      - name: probe
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        run: |
          EXTRA=""
          [ "$RUNNER_OS" = Linux ] && EXTRA='-s duckdb-extension-httpfs>=1.5,<2'
          pixi exec -c ga-fdp/label/staging -c ga-fdp -c conda-forge \
            -s "python 3.13.*" -s "toksearch ==2.23.2" -s "python-duckdb >=1.5,<2" -s curl -s openssl $EXTRA \
            -- python -u diag/tls_probe.py

  suite:
    strategy:
      fail-fast: false
      matrix:
        mode:
          - xrd-bisect
    runs-on: macos-15
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: python-313-cap
          path: src
      - uses: actions/checkout@v4
        with:
          sparse-checkout: diag
          path: probe
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          run-install: false
      - name: ${{ matrix.mode }}
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          MODE: ${{ matrix.mode }}
          TRACE: ${{ github.workspace }}/probe/diag/trace_run.py
        run: |
          pixi exec -c ga-fdp/label/staging -c ga-fdp -c conda-forge \
            -s "python 3.12.*" -s "toksearch ==2.23.2" -s "ptdata >=2.13.0,<3" \
            -s "python-duckdb >=1.5,<2" -s "fdp >=0.12.1" -s toksearch_d3d -s pip \
            -- bash -c '
              set -x
              python -m pip install --no-deps --no-build-isolation ./src >/dev/null 2>&1 || python -m pip install --no-deps ./src
              python -c "import toksearch_d3d, toksearch, ssl; print(toksearch_d3d.__file__, toksearch.__version__, ssl.get_default_verify_paths())"
              cd src/tests
              R="python $TRACE $GITHUB_WORKSPACE/probe/diag/run_order.py"
              L=test_sql_snapshot_live
              X="python $GITHUB_WORKSPACE/probe/diag/xrd_probe.py"
              case "$MODE" in
                xrd-bisect) for m in plain xrd curlplugin xrd-httplib plain; do fdp run $X $m 12 2>&1 | grep -vE "Warning|warn"; done ;;
                live-only) for i in 1 2 3; do echo "=== live run $i $(date +%T)"; fdp run $R $L 2>&1 | grep -E "trace|ok$|ERROR|FAIL|Error|Ran "; done ;;
                after-sql) fdp run $R test_sql $L ;;
                after-ptdata) fdp run $R test_ptdata_signal test_ptdata_signal_calibration test_ptdata_signal_pinning test_ptdata_signal_reader_reuse test_ptdata_signal_text $L ;;
                after-imas-cake) fdp run $R test_imas_layout test_imas_redial test_imas_signal test_cake_cache test_cake_signal $L ;;
                after-rest) fdp run $R test_catalog test_fdp_decoupling test_llm_pr4_contributor test_pcssetup_live test_pcssetup_reader test_pcssetup_to_wa10 test_signal_spec $L ;;
              esac 2>&1 | grep -E "trace|test_sql_snapshot_live|ERROR|FAIL|Error|Ran |curl-says|SUMMARY|resolved|libs|^  [$/]|Traceback" | cut -c1-400 | tail -120
            '
