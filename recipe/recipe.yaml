context:
  version: ${{ env.get("PKG_VERSION") }}

package:
  name: toksearch_d3d
  version: ${{ version }}

source:
  path: ..

build:
  # Pure Python, nothing compiled (src/ptdata_plugin is not built or
  # shipped): one build serves every platform and every python in the run
  # range, osx-arm64 included.
  noarch: python
  # One noarch build per OS (variants.yaml): only the Linux one can depend on
  # conda-forge's duckdb-extension-httpfs. The OS is in the build string so
  # each CI leg can pick its own.
  string: pyh${{ hash }}_${{ noarch_platform }}
  script:
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    # The pythons toksearch is built for.
    - python >=3.11,<3.13
    - setuptools
    - pip
    - versioneer
  run:
    - python >=3.11,<3.13
    # >=2.14.0, not >=2.12.0: this package's signals declare
    # gather(self, shot, version=None, snapshot=None). An older toksearch
    # calls gather(shot, record=record) and raises TypeError on the first
    # fetch. Unlike the pinning floors in fdp-core, the solver CAN enforce
    # this one, so it does.
    # 2.16.0 renamed the per-record pin field from `snapshot` to `catalog`
    # and REFUSES the old spelling rather than ignoring it. This package's
    # module docstring documents that field, and CLAUDE.md tells users to
    # read it before writing a pipeline -- so below this floor the
    # documentation teaches a spelling toksearch rejects.
    # connect_d3drdb() reads a published snapshot by default (D2). toksearch
    # imports these lazily and does not declare them; the device package
    # that ships the sql_snapshot locator does.
    # 2.18.0 could not resolve a pelican:// snapshot base (User-Agent 403), so the floor is 2.18.1.
    # 2.18.2: snapshot result columns take the query's spelling, as SQL Server's
    # do. The d3drdb skill and the docstring describe that behaviour, so the
    # pairing with 2.18.1 would document something false (df["shot"] raises).
    # 2.19.0 settles and replays the d3drdb snapshot at compute(): a pipeline
    # pins it for its workers, and Pipeline.from_snapshot replays a saved one.
    - toksearch >=2.19.0
    - python-duckdb >=1.5,<2
    # conda-forge's osx-arm64 extension cannot be installed (re-signing its
    # prefix-rewritten binary fails), so macOS loads DuckDB's own signed
    # httpfs instead -- which toksearch does from 2.22.0.
    - if: noarch_platform == "linux"
      then:
        - __linux
        - duckdb-extension-httpfs >=1.5,<2
    - if: noarch_platform == "osx"
      then:
        - __osx
        - toksearch >=2.22.0
    - sqlglot >=30
    # d3d.yaml declares a sql_snapshot locator. An older fdp-schema rejects
    # the WHOLE file (the locator union is discriminated on kind), not just
    # that entry -- so this floor is what keeps the catalog loadable.
    - fdp-schema >=0.3.0
    # PtDataSignal reads ExtractedData.text, the decoded text of an ASCII point.
    - ptdata >=2.13.0,<3
    - imas_composer >=0.2.4,<0.3
    - filelock >=3
    # CakeSignal fetches the CAKE DB by shelling out to the `pelican` CLI
    # (toksearch_d3d/signal/_cake_cache.py). Declare it so a standalone
    # `conda install toksearch_d3d` has the binary, rather than relying on
    # it being present transitively via fdp.
    - pelicanplatform >=7.24.3,<8

tests:
  - script:
      env:
        BEARER_TOKEN: ${{ env.get("BEARER_TOKEN", default="") }}
      content:
        # --fast-exit avoids Python's interpreter shutdown hang on
        # C-extension worker threads (libfdpio/XRootD/Pelican). Test
        # outcomes and exit code are preserved; see testit.py for details.
        - fdp run bash -c 'cd tests && python testit.py --fast-exit'
    files:
      source:
        - tests/
    requirements:
      run:
        # `fdp run` is invoked above; fdp is no longer a release run-dep
        # of toksearch_d3d (Phase 1 catalog migration), but the recipe
        # test driver still needs it. Declared here so the test env has it.
        # 0.12.1: `fdp snapshot save` records the d3drdb snapshot (TestPinning).
        - fdp >=0.12.1
  # NOTE: removed the `python: imports: - toksearch_d3d` test. It ran
  # `import toksearch_d3d` in a clean env (no FDP env vars set), which
  # triggered libfdpio + libXrdCl load with no XRD_PLUGINCONFDIR, hanging
  # for 30+ minutes on Pelican plugin registration. The script test above
  # already exercises imports (testit.py imports toksearch_d3d under
  # `fdp run`, which sets the env first).

about:
  license: Apache-2.0
  summary: "TokSearch DIII-D: Signal retrieval classes for DIII-D fusion experiment data"

extra:
  recipe-maintainers:
    - sammuli
