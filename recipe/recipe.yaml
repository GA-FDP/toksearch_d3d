context:
  version: ${{ env.get("PKG_VERSION") }}

package:
  name: toksearch_d3d
  version: ${{ version }}

source:
  path: ..

build:
  script:
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - setuptools
    - pip
    - versioneer
  run:
    - python
    - toksearch >=2.4.1
    - ptdata >=1.4.1

tests:
  - script:
      env:
        BEARER_TOKEN: ${{ env.get("BEARER_TOKEN", default="") }}
      content:
        - fdp run bash -c 'cd tests && python testit.py'
    files:
      source:
        - tests/
  - python:
      imports:
        - toksearch_d3d

about:
  license: Apache-2.0
  summary: "TokSearch DIII-D: Signal retrieval classes for DIII-D fusion experiment data"

extra:
  recipe-maintainers:
    - sammuli
