schema_version: 1
name: d3d
description: DIII-D fusion experiment, via Pelican
pelican_root: pelican://osg-htc.org:443/fdp-d3d
origin_server: root://fdp-d3d-origin.nationalresearchplatform.org:8443
# The LLM backend/preset is a deployment-level choice (set via
# $FDP_LLM_BACKEND or ~/.fdp/config.toml [llm].backend), not a per-device
# one. GA on-prem users select the `amsc` preset there. The `amsc` preset
# itself is still contributed (toksearch.llm.presets entry point); only the
# per-device default pointer was removed.

locators:
  - kind: mds_tree
    name: main
    transport: pelican
    search_path:
      - pelican://osg-htc.org:443/fdp-d3d/archives/mdsplus/codes/~t/~j~i/~h~g/~f~e/~d~c
      - pelican://osg-htc.org:443/fdp-d3d/archives/mdsplus/usershots/~t
      - pelican://osg-htc.org:443/fdp-d3d/archives/mdsplus/models/~t
      - pelican://osg-htc.org:443/fdp-d3d/archives/mdsplus/shots/~t/~f~e/~d~c
    auth: { kind: bearer_token, env: BEARER_TOKEN }

  - kind: ptdata_indexed
    name: main
    transport: pelican
    index_dir: pelican://osg-htc.org:443/fdp-d3d/archives/index/json
    index_pattern: "json_indexes_*"
    auth: { kind: bearer_token, env: BEARER_TOKEN }

  - kind: sql
    name: d3drdb
    driver: mssql
    host: d3drdb.gat.com
    port: 8001
    database: d3drdb
    tdsver: "7.0"
    auth: { kind: password_file, path: ~/D3DRDB.sybase_login }

  # Published, immutable snapshots of d3drdb: Parquet per table under
  # metadata/d3drdb/d3drdb_<stamp>/, read remotely. Same name as the live
  # locator above on purpose -- connect_d3drdb(live=True) finds it by that.
  # Nothing under _spike or any other name matches id_pattern.
  - kind: sql_snapshot
    name: d3drdb
    base_url: pelican://osg-htc.org:443/fdp-d3d/metadata/d3drdb
    id_pattern: "d3drdb_*"
    auth: { kind: bearer_token, env: BEARER_TOKEN }

extra_env:
  D3DATA: "yes"
  SYS_D3_DELIM: ";"
  CAKE_DB_PATH: "pelican://osg-htc.org:443/fdp-d3d/metadata/iri_logs.db"
